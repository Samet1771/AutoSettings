# Presentation mode
# While PowerPoint is the active window: mute sounds, keep the screen on and use light mode.
# Switching to another window restores the previous settings; coming back applies them again.
version: 1

automations:
  - id: presentation-mode
    name: Presentation mode while PowerPoint is focused
    triggers:
      - type: app_focused
        app: POWERPNT.EXE
    actions:
      - type: profile.apply
        profile: presentation
        revert_on: app_unfocused

profiles:
  - id: presentation
    name: Presentation
    actions:
      - type: audio.mute
        state: mute
      - type: power.screen_timeout
        minutes: 0
      - type: theme.mode
        mode: light
