name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AutoSettings.slnx

      - name: Build
        run: dotnet build AutoSettings.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AutoSettings.slnx --configuration Release --no-build --logger "console;verbosity=normal"
