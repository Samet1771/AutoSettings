# Builds the release files (MSI installer + portable zip, optional code signing, winget manifests,
# SHA256SUMS.txt) and attaches them to a GitHub Release. Runs when:
#   - a release is published on the website with a tag like v0.2.0 (Releases -> Draft a new release),
#   - a tag like v0.2.0 is pushed (git tag v0.2.0 && git push origin v0.2.0), or
#   - it is started by hand (Actions -> Release -> Run workflow) with a tag; a tag that does not exist yet is
#     created on the head of the chosen branch (beta for betas, main for stable releases).
name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v0.2.0-beta.1 or v0.2.0"
        required: true
      branch:
        description: "Branch to create the tag on when it does not exist yet (beta or main)"
        required: false
        default: beta

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

jobs:
  # Publishing a release on the website also pushes its tag, which starts this workflow a second time.
  # The tag-push run is only needed when no release exists yet (git tag + git push).
  # Started by hand, the gate also creates the tag if needed.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Create the tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Release tags must look like v0.2.0 or v0.3.0-beta.1 (got '$TAG')."
            exit 1
          fi
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "Tag $TAG already exists; building it."
            exit 0
          fi
          sha=$(gh api "repos/${{ github.repository }}/commits/$BRANCH" --jq .sha)
          gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$TAG" -f sha="$sha" > /dev/null
          echo "::notice::Created tag $TAG on $BRANCH ($sha)."

      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "::notice::A release for $TAG already exists; it is built by its own release run, so this tag-push run is skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-latest
    env:
      # Optional code signing: add these repository secrets (base64 .pfx and its password).
      SIGNING_CERT: ${{ secrets.SIGNING_CERT }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - name: Check the tag
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+(\.\d+)?(-[0-9A-Za-z.]+)?$') {
            Write-Output "::error::Release tags must look like v0.2.0 or v0.3.0-beta.1 (got '$env:TAG'). Delete this release and its tag, then create it again with a version tag."
            exit 1
          }

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $version = $env:TAG.Substring(1)
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test AutoSettings.slnx -c Release -p:Version=${{ steps.version.outputs.value }}

      - name: Publish
        shell: pwsh
        run: |
          $out = "artifacts/AutoSettings"
          dotnet publish src/AutoSettings.Service -c Release -r win-x64 --self-contained -o $out -p:Version=${{ steps.version.outputs.value }}
          dotnet publish src/AutoSettings.Agent -c Release -r win-x64 --self-contained -o $out -p:Version=${{ steps.version.outputs.value }}
          Copy-Item scripts/install.ps1, scripts/uninstall.ps1 $out

      - name: Sign executables (optional)
        if: ${{ env.SIGNING_CERT != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:SIGNING_CERT))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool sign /f cert.pfx /p $env:SIGNING_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 artifacts/AutoSettings/AutoSettings.Service.exe artifacts/AutoSettings/AutoSettings.Agent.exe

      - name: Build MSI
        shell: pwsh
        run: dotnet build installer/AutoSettings.Installer/AutoSettings.Installer.wixproj -c Release -p:Version=${{ steps.version.outputs.value }} -p:PublishDir="$PWD\artifacts\AutoSettings" -o artifacts/msi

      - name: Sign MSI (optional)
        if: ${{ env.SIGNING_CERT != '' }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool sign /f cert.pfx /p $env:SIGNING_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 (Get-ChildItem artifacts/msi/*.msi).FullName
          Remove-Item cert.pfx

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $msi = (Get-ChildItem artifacts/msi/*.msi).FullName
          $zip = "artifacts/AutoSettings-$version-win-x64.zip"
          Compress-Archive -Path artifacts/AutoSettings/* -DestinationPath $zip
          $sha = (Get-FileHash $msi -Algorithm SHA256).Hash
          $url = "https://github.com/${{ github.repository }}/releases/download/$($env:TAG)/$(Split-Path $msi -Leaf)"
          New-Item -ItemType Directory artifacts/winget -Force | Out-Null
          foreach ($template in Get-ChildItem packaging/winget/*.yaml) {
            (Get-Content $template -Raw).Replace('{{VERSION}}', $version).Replace('{{URL}}', $url).Replace('{{SHA256}}', $sha) |
              Set-Content (Join-Path artifacts/winget $template.Name) -NoNewline
          }
          Compress-Archive -Path artifacts/winget/* -DestinationPath "artifacts/winget-manifests-$version.zip"
          # The app's updater verifies the MSI against this file.
          $sums = foreach ($file in @($msi, $zip)) {
            "{0}  {1}" -f (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant(), (Split-Path $file -Leaf)
          }
          [IO.File]::WriteAllText("$PWD/artifacts/SHA256SUMS.txt", ($sums -join "`n") + "`n")
          "msi=$msi" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Find an existing release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG --repo ${{ github.repository }} --json tagName *> $null
          "exists=$($LASTEXITCODE -eq 0)".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          exit 0

      # A release made on the website keeps its title, notes and pre-release box; only the files are added.
      - name: Attach files to the existing release
        if: steps.existing.outputs.exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            ${{ steps.package.outputs.msi }}
            ${{ steps.package.outputs.zip }}
            artifacts/SHA256SUMS.txt
            artifacts/winget-manifests-${{ steps.version.outputs.value }}.zip

      - name: Create the release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: AutoSettings ${{ steps.version.outputs.value }}
          generate_release_notes: true
          # Tags like v0.3.0-beta.1 are pre-releases: only offered to users who opted in to beta versions.
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            ${{ steps.package.outputs.msi }}
            ${{ steps.package.outputs.zip }}
            artifacts/SHA256SUMS.txt
            artifacts/winget-manifests-${{ steps.version.outputs.value }}.zip
