version: 1
automations:
  - id: evening-look
    name: Evening look
    triggers:
      - type: logon
      - type: unlock
    conditions:
      - type: time
        after: "20:00"
        before: "07:00"
    actions:
      - type: theme.mode
        mode: dark
      - type: display.brightness
        level: 40
        monitor: internal
        continue_on_error: true
  - id: daytime-look
    name: Daytime look
    triggers:
      - type: logon
      - type: unlock
    conditions:
      - type: time
        after: "07:00"
        before: "20:00"
    actions:
      - type: theme.mode
        mode: light
      - type: display.brightness
        level: 80
        monitor: internal
        continue_on_error: true
